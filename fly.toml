# Fly.io app configuration
# Update "app" value with your actual app name during deployment
app = "your-app-name"  # Change this during 'fly launch'
primary_region = "iad"

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256
